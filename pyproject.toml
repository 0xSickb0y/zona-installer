[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zona"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests", "vdf"]

[project.scripts]
zona = "zona.main:main"

[tool.setuptools.packages.find]
include = ["zona*"]

[tool.setuptools.package-data]
zona = [
    "config.toml",
    "templates/*.ini"
]