  { filename = "zona_multipart.7z.004", url = "https://github.com/gtair/filehost-1/releases/download/v1.38/zona_multipart.7z.004", md5 = "22e10771e3b06fda5fc8aa4dcfb2b9a0" },
  { filename = "zona_multipart.7z.005", url = "https://github.com/gtair/filehost-1/releases/download/v1.38/zona_multipart.7z.005", md5 = "969e63d0027a9d47d52017571972c252" },
